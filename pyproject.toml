[project]
name = "ambrolt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Richard Michael Coo", email = "richard.michael.coo@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
ambrolt = "ambrolt:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "cz-conventional-gitmoji>=0.7.0",
    "pre-commit>=4.7.0",
]

[tool.commitizen]
name = "cz_gitmoji"
